# Consulta verificada de carteira: lacunas e duplicidades de numeracao em todas as empresas (DC-1).
# Mesma regra de `conferir_numeracao` (D-317, T5.5), agora por empresa em uma chamada: a pergunta real
# e saber, na carteira, quais clientes tem buraco na sequencia de notas emitidas antes de fechar o
# mes (o Dominio so da a conferencia nota a nota, empresa por empresa).
# SA 17.0.11 nao tem LAG/LEAD: a lacuna sai do pareamento de numeros consecutivos por ROW_NUMBER, e a
# lacuna compara o proximo numero com o MAIOR fim de todas as faixas anteriores (faixas sobrepostas).
version: 1
name: carteira_numeracao
titulo: Lacunas e duplicidades de numeracao, por empresa
descricao: >-
  Por empresa ativa que usa escrita fiscal, especie e serie das notas emitidas (`documento` =
  saidas ou servicos) numa janela de ate 13 meses: quantas lacunas (`lacunas`), quantos numeros
  faltam no total (`numeros_faltantes`) e quantos numeros aparecem duplicados (`duplicidades`).
  Saltos maiores que `lacuna_maxima` (padrao 10000) sao tratados como outra numeracao e ignorados.
  Ordenado pelo numero de lacunas. Para ver os numeros exatos de uma empresa use
  `conferir_numeracao`.
aviso: >-
  Diagnostico: um numero cancelado conta como usado, a numeracao fora da janela nao e vista e uma
  serie que recomeca (nova serie, inutilizacao) aparece como lacuna. Confira no Dominio antes de agir.
# Orcamento (DC-1): custo estimado medido na janela mais larga = 7347; orcamento ~4x, nunca acima do teto duro.
orcamento: {custo: 30000, linhas: 100000000, medido_ms: 1100}
parametros:
  - {nome: documento, tipo: choice, valores: [saidas, servicos], obrigatorio: true, descricao: "Qual escrituracao conferir"}
  - {nome: inicio, tipo: date, obrigatorio: true, descricao: "Primeiro dia da janela (AAAA-MM-DD)"}
  - {nome: fim, tipo: date, obrigatorio: true, descricao: "Ultimo dia da janela, no maximo 13 meses depois do inicio"}
  - {nome: lacuna_maxima, tipo: int, padrao: 10000, minimo: 1, maximo: 1000000000, descricao: "Ignora saltos maiores que isto (outra numeracao, nao omissao)"}
  - {nome: codi_emp, tipo: int, descricao: "So esta empresa (codigo no Dominio)"}
  - {nome: limite, tipo: int, padrao: 100, minimo: 1, maximo: 500, descricao: "Linhas a devolver"}
janela: {inicio: inicio, fim: fim}
variante_por: documento
variantes:
  saidas:
    dependencias:
      geempre: {codi_emp: normal, razao_emp: texto_livre, stat_emp: normal, uefi_emp: normal}
      efsaidas: {codi_emp: normal, codi_esp: normal, seri_sai: normal, nume_sai: normal, atex_sai: normal, segi_sai: normal, dsai_sai: normal}
    sql: >-
      SELECT TOP {top} START AT {start} codi_emp, razao_emp, especie, serie, lacunas, numeros_faltantes, maior_lacuna, duplicidades FROM (
        SELECT g.codi_emp AS codi_emp, g.razao_emp AS razao_emp, r.esp AS especie, r.serie AS serie,
               SUM(r.lac) AS lacunas, SUM(r.falt) AS numeros_faltantes, MAX(r.falt) AS maior_lacuna, SUM(r.dup) AS duplicidades
        FROM bethadba.geempre g
        JOIN (
          SELECT a.emp AS emp, a.esp AS esp, a.serie AS serie, 1 AS lac, b.nume - a.coberto - 1 AS falt, 0 AS dup
          FROM (
            SELECT emp, esp, serie, nume,
                   MAX(ultimo) OVER (PARTITION BY emp, esp, serie ORDER BY nume ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS coberto,
                   ROW_NUMBER() OVER (PARTITION BY emp, esp, serie ORDER BY nume) AS rn
            FROM (
              SELECT codi_emp AS emp, codi_esp AS esp, TRIM(seri_sai) AS serie, nume_sai AS nume,
                     MAX(CASE WHEN atex_sai > nume_sai THEN atex_sai ELSE nume_sai END) AS ultimo
              FROM bethadba.efsaidas
              WHERE dsai_sai BETWEEN ?inicio AND ?fim
                {?codi_emp: AND codi_emp = ?codi_emp}
              GROUP BY codi_emp, codi_esp, TRIM(seri_sai), nume_sai
            ) d1
          ) a
          JOIN (
            SELECT emp, esp, serie, nume,
                   ROW_NUMBER() OVER (PARTITION BY emp, esp, serie ORDER BY nume) AS rn
            FROM (
              SELECT codi_emp AS emp, codi_esp AS esp, TRIM(seri_sai) AS serie, nume_sai AS nume
              FROM bethadba.efsaidas
              WHERE dsai_sai BETWEEN ?inicio AND ?fim
                {?codi_emp: AND codi_emp = ?codi_emp}
              GROUP BY codi_emp, codi_esp, TRIM(seri_sai), nume_sai
            ) d2
          ) b ON b.emp = a.emp AND b.esp = a.esp AND b.serie = a.serie AND b.rn = a.rn + 1
          WHERE b.nume - a.coberto > 1 AND b.nume - a.coberto - 1 <= ?lacuna_maxima
          UNION ALL
          SELECT codi_emp, codi_esp, TRIM(seri_sai), 0, 0, 1
          FROM bethadba.efsaidas
          WHERE dsai_sai BETWEEN ?inicio AND ?fim
            {?codi_emp: AND codi_emp = ?codi_emp}
          GROUP BY codi_emp, codi_esp, TRIM(seri_sai), nume_sai, segi_sai
          HAVING COUNT(*) > 1
        ) r ON r.emp = g.codi_emp
        WHERE g.stat_emp = 'A' AND g.uefi_emp = 1
        GROUP BY g.codi_emp, g.razao_emp, r.esp, r.serie
      ) x
      ORDER BY lacunas DESC, duplicidades DESC, codi_emp, especie, serie
  servicos:
    dependencias:
      geempre: {codi_emp: normal, razao_emp: texto_livre, stat_emp: normal, uefi_emp: normal}
      efservicos: {codi_emp: normal, codi_esp: normal, seri_ser: normal, nume_ser: normal, atex_ser: normal, segi_ser: normal, dser_ser: normal}
    sql: >-
      SELECT TOP {top} START AT {start} codi_emp, razao_emp, especie, serie, lacunas, numeros_faltantes, maior_lacuna, duplicidades FROM (
        SELECT g.codi_emp AS codi_emp, g.razao_emp AS razao_emp, r.esp AS especie, r.serie AS serie,
               SUM(r.lac) AS lacunas, SUM(r.falt) AS numeros_faltantes, MAX(r.falt) AS maior_lacuna, SUM(r.dup) AS duplicidades
        FROM bethadba.geempre g
        JOIN (
          SELECT a.emp AS emp, a.esp AS esp, a.serie AS serie, 1 AS lac, b.nume - a.coberto - 1 AS falt, 0 AS dup
          FROM (
            SELECT emp, esp, serie, nume,
                   MAX(ultimo) OVER (PARTITION BY emp, esp, serie ORDER BY nume ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS coberto,
                   ROW_NUMBER() OVER (PARTITION BY emp, esp, serie ORDER BY nume) AS rn
            FROM (
              SELECT codi_emp AS emp, codi_esp AS esp, TRIM(seri_ser) AS serie, nume_ser AS nume,
                     MAX(CASE WHEN atex_ser > nume_ser THEN atex_ser ELSE nume_ser END) AS ultimo
              FROM bethadba.efservicos
              WHERE dser_ser BETWEEN ?inicio AND ?fim
                {?codi_emp: AND codi_emp = ?codi_emp}
              GROUP BY codi_emp, codi_esp, TRIM(seri_ser), nume_ser
            ) d1
          ) a
          JOIN (
            SELECT emp, esp, serie, nume,
                   ROW_NUMBER() OVER (PARTITION BY emp, esp, serie ORDER BY nume) AS rn
            FROM (
              SELECT codi_emp AS emp, codi_esp AS esp, TRIM(seri_ser) AS serie, nume_ser AS nume
              FROM bethadba.efservicos
              WHERE dser_ser BETWEEN ?inicio AND ?fim
                {?codi_emp: AND codi_emp = ?codi_emp}
              GROUP BY codi_emp, codi_esp, TRIM(seri_ser), nume_ser
            ) d2
          ) b ON b.emp = a.emp AND b.esp = a.esp AND b.serie = a.serie AND b.rn = a.rn + 1
          WHERE b.nume - a.coberto > 1 AND b.nume - a.coberto - 1 <= ?lacuna_maxima
          UNION ALL
          SELECT codi_emp, codi_esp, TRIM(seri_ser), 0, 0, 1
          FROM bethadba.efservicos
          WHERE dser_ser BETWEEN ?inicio AND ?fim
            {?codi_emp: AND codi_emp = ?codi_emp}
          GROUP BY codi_emp, codi_esp, TRIM(seri_ser), nume_ser, segi_ser
          HAVING COUNT(*) > 1
        ) r ON r.emp = g.codi_emp
        WHERE g.stat_emp = 'A' AND g.uefi_emp = 1
        GROUP BY g.codi_emp, g.razao_emp, r.esp, r.serie
      ) x
      ORDER BY lacunas DESC, duplicidades DESC, codi_emp, especie, serie
saidas:
  - {nome: codi_emp, tipo: int, classe: normal}
  - {nome: razao_emp, tipo: text, classe: texto_livre}
  - {nome: especie, tipo: int, classe: normal}
  - {nome: serie, tipo: text, classe: normal}
  - {nome: lacunas, tipo: int, classe: normal}
  - {nome: numeros_faltantes, tipo: int, classe: normal}
  - {nome: maior_lacuna, tipo: int, classe: normal}
  - {nome: duplicidades, tipo: int, classe: normal}
