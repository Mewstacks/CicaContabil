# Glossario do contador (PT-BR) -> termos que existem nos nomes e comentarios do banco (D-318).
# Sem acento e em minusculas. Frases proprias; nada copiado do dicionario do Dominio.
version: 1

# Palavras que nao ajudam a achar tabela.
stopwords: [de, da, do, das, dos, e, o, a, os, as, em, no, na, nos, nas, para, por, com, que,
  quais, qual, como, um, uma, uns, umas, ao, aos, ter, tem, ver, listar, mostrar, quero, preciso,
  saber, dados, tabela, tabelas, sobre, entre, ou, se, seu, sua, todas, todos, ultimo, ultimos]

