[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[project]
name = "dominio-mcp"
version = "0.1.0"
description = "MCP somente leitura para o banco do Dominio (SQL Anywhere): mapa do esquema, consultas verificadas e consulta estruturada, sem expor segredo."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "PyYAML==6.0.3",
  "mcp==2.3.0",
  "pydantic==2.14.2",
  "pyodbc==5.3.0",
]

[project.scripts]
dominio-mcp = "dominio_mcp.cli:main"

[dependency-groups]
dev = [
  "hypothesis==6.170.14",
  "mypy==1.19.1",
  "pytest==9.0.3",
  "pytest-timeout==2.4.0",
  "ruff==0.16.0",
  "types-PyYAML==6.0.12.20260906",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config -ra -m \"not eval\""
timeout = 60
timeout_method = "thread"
markers = [
  "live: le o banco real do Dominio, somente leitura; so roda com DOMINIO_MCP_LIVE=1",
  "eval: mede a recuperacao do esquema (conjuntos de desenvolvimento e cego)",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S", "RUF"]
ignore = [
  "S101", # assert e esperado nos testes
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S105", "S106", "S311"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src"]
