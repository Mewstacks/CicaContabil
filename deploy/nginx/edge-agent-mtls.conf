# Include in the TLS server that proxies to a private loopback-only Django backend.
# Render ONLY ${EDGE_AGENT_MTLS_PROXY_SECRET} with envsubst before nginx -t.
# The gateway secret must be at least 32 random characters, match Django's value,
# remain outside Git/logs, and must never be returned to the Windows agent.
ssl_protocols TLSv1.2 TLSv1.3;
ssl_client_certificate /etc/hubcontador/mtls/agent-ca.pem;
ssl_verify_client optional;
ssl_verify_depth 2;

location = /api/agent/v2/enroll {
    # CSR + one-use code bootstrap; the Windows private key never leaves the PC.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Hub-MTLS-Gateway "";
    proxy_set_header X-Hub-MTLS-Verified "";
    proxy_set_header X-Hub-MTLS-Client-Cert "";
    proxy_pass http://127.0.0.1:8000;
}

location ^~ /api/agent/v2/ {
    if ($ssl_client_verify != SUCCESS) { return 496; }
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Hub-MTLS-Gateway "${EDGE_AGENT_MTLS_PROXY_SECRET}";
    proxy_set_header X-Hub-MTLS-Verified $ssl_client_verify;
    proxy_set_header X-Hub-MTLS-Client-Cert $ssl_client_escaped_cert;
    proxy_pass http://127.0.0.1:8000;
}

location = /api/v1/intelligence/agent/sync/ {
    if ($ssl_client_verify != SUCCESS) { return 496; }
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Hub-MTLS-Gateway "${EDGE_AGENT_MTLS_PROXY_SECRET}";
    proxy_set_header X-Hub-MTLS-Verified $ssl_client_verify;
    proxy_set_header X-Hub-MTLS-Client-Cert $ssl_client_escaped_cert;
    proxy_pass http://127.0.0.1:8000;
}

location = /api/v1/intelligence/agent/enroll/ {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Hub-MTLS-Gateway "";
    proxy_set_header X-Hub-MTLS-Verified "";
    proxy_set_header X-Hub-MTLS-Client-Cert "";
    proxy_pass http://127.0.0.1:8000;
}
