# Include inside the HTTPS server block that proxies to the loopback-only Hub.
# Keep these PEM files outside Git and readable only by the proxy service account.

ssl_protocols TLSv1.2 TLSv1.3;
ssl_client_certificate /etc/hubcontador/mtls/agent-ca.pem;
ssl_verify_client optional;
ssl_verify_depth 2;

location = /api/v1/intelligence/agent/sync/ {
    # Nginx verifies the client certificate against agent-ca.pem. It overrides
    # client-controlled headers before proxying to the private web process.
    if ($ssl_client_verify != SUCCESS) { return 496; }
    proxy_set_header X-Hub-MTLS-Verified $ssl_client_verify;
    proxy_set_header X-Hub-MTLS-Client-Cert $ssl_client_escaped_cert;
    proxy_set_header X-Hub-Agent-ID $http_x_hub_agent_id;
    proxy_set_header X-Hub-Agent-Timestamp $http_x_hub_agent_timestamp;
    proxy_set_header X-Hub-Agent-Signature $http_x_hub_agent_signature;
    proxy_pass http://127.0.0.1:8000;
}

location = /api/v1/intelligence/agent/enroll/ {
    # One-time code bootstrap records the fingerprint of an already-issued
    # technical certificate; it never accepts a private key or CSR.
    proxy_set_header X-Hub-MTLS-Verified "";
    proxy_set_header X-Hub-MTLS-Client-Cert "";
    proxy_pass http://127.0.0.1:8000;
}
