# Change this with: python scripts/configure_fly.py your-unique-app-name
app = "cica-contabil"
primary_region = "gru"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "python -m config.release"
  release_command_timeout = "10m"
  strategy = "canary"
  wait_timeout = "10m"

[env]
  ADMIN_ENABLED = "false"
  API_DOCS_ENABLED = "false"
  DJANGO_SETTINGS_MODULE = "config.settings.production"
  DB_SSL_REQUIRE = "true"
  # Neon is reached over the public network, so TLS must be enforced by Django.
  DB_TLS_ENFORCED_BY_NETWORK = "false"
  DEMO_ENTRY_ENABLED = "true"
  DEMO_SESSION_ISOLATION_READY = "true"
  EDGE_AGENT_MTLS_REQUIRED = "false"
  LOG_LEVEL = "INFO"
  NFSE_ADN_SYNC_ENABLED = "true"
  NFSE_ADN_ENVIRONMENT = "production"
  OBJECT_STORAGE_REQUIRED = "true"
  PORT = "8000"
  PRIMARY_REGION = "gru"
  SENTRY_ENABLED = "false"
  SENTRY_ENVIRONMENT = "production"
  SENTRY_TRACES_SAMPLE_RATE = "0.05"

[processes]
  web = "gunicorn config.asgi:application --bind 0.0.0.0:8000 --worker-class uvicorn_worker.UvicornWorker --workers 2 --timeout 30 --graceful-timeout 30 --max-requests 1000 --max-requests-jitter 100 --access-logfile - --error-logfile - --no-control-socket"
  worker = "celery -A config worker --beat --schedule=/tmp/celerybeat-schedule --loglevel=INFO --concurrency=1"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["web"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 100
    hard_limit = 150

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    # The proxy only needs to know whether the web process can serve traffic.
    # Dependency readiness remains available for deploy gates and operators;
    # probing it every 15 seconds would keep serverless Postgres permanently awake.
    path = "/api/v1/health/live/"
    headers = { Host = "cica-contabil.fly.dev", X-Forwarded-Proto = "https" }

[[vm]]
  processes = ["web"]
  size = "shared-cpu-1x"
  memory = "512mb"

[[vm]]
  processes = ["worker"]
  size = "shared-cpu-1x"
  memory = "512mb"
