{% load profitability_extras %}
{% if pagina.has_other_pages %}
<nav class="profitability-pagination" aria-label="Páginas">
  {% if pagina.has_previous %}<a href="?{{ request.GET|pagina_url:pagina.previous_page_number }}">Anterior</a>{% endif %}
  <span>Página {{ pagina.number }} de {{ pagina.paginator.num_pages }}</span>
  {% if pagina.has_next %}<a href="?{{ request.GET|pagina_url:pagina.next_page_number }}">Próxima</a>{% endif %}
</nav>
{% endif %}
