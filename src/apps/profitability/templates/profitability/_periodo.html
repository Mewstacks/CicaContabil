{% if competencias|length > 1 %}
<form class="profitability-period" method="get">
  <label for="profitability-competencia">Competência</label>
  <select id="profitability-competencia" name="competencia" autocomplete="off">{% for item in competencias %}<option value="{{ item }}"{% if item == competencia %} selected{% endif %}>{{ item }}</option>{% endfor %}</select>
  <button class="button button-secondary" type="submit">Ver</button>
</form>
{% endif %}
