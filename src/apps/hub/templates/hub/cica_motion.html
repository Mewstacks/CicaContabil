<figure class="cica-product-demo" data-cica-demo aria-label="Demonstração visual dos módulos da CICA. Selecione uma aba para ver cada fluxo ilustrativo.">
  <header class="demo-topbar" aria-hidden="true">
    <div class="demo-brand"><span>C</span><strong>CICA</strong></div>
    <div class="demo-context"><i></i> Escritório conectado</div>
    <small>Demonstração</small>
  </header>
  <div class="demo-workspace">
    <nav class="demo-sidebar" role="tablist" aria-label="Módulos demonstrados">
      <button id="demo-tab-nfse" type="button" role="tab" data-demo-nav="nfse" aria-controls="demo-panel-nfse" aria-selected="true">NFS-e</button>
      <button id="demo-tab-guides" type="button" role="tab" data-demo-nav="guides" aria-controls="demo-panel-guides" aria-selected="false">Guias</button>
      <button id="demo-tab-integra" type="button" role="tab" data-demo-nav="integra" aria-controls="demo-panel-integra" aria-selected="false">Integra</button>
      <button id="demo-tab-reconciliation" type="button" role="tab" data-demo-nav="reconciliation" aria-controls="demo-panel-reconciliation" aria-selected="false">OFX</button>
      <button id="demo-tab-reform" type="button" role="tab" data-demo-nav="reform" aria-controls="demo-panel-reform" aria-selected="false">Radar</button>
      <button id="demo-tab-triage" type="button" role="tab" data-demo-nav="triage" aria-controls="demo-panel-triage" aria-selected="false">Triagem</button>
    </nav>
    <div class="demo-stage">
      <section id="demo-panel-nfse" class="demo-panel" data-demo-panel="nfse" role="tabpanel" aria-labelledby="demo-tab-nfse">
        <div class="demo-panel-head"><div><small>FISCAL · MARÇO</small><h2>NFS-e recebidas</h2></div><span>Atualizado agora</span></div>
        <div class="demo-metric"><strong>184</strong><p>documentos organizados por empresa e competência</p></div>
        <ul><li><i class="is-ok"></i><div><b>Alvorada Serviços</b><small>12 notas classificadas</small></div><em>Conferido</em></li><li><i class="is-alert"></i><div><b>Nova Estrutura</b><small>Classificação fora da regra</small></div><em>Revisar</em></li></ul>
      </section>
      <section id="demo-panel-guides" class="demo-panel" data-demo-panel="guides" role="tabpanel" aria-labelledby="demo-tab-guides" aria-hidden="true">
        <div class="demo-panel-head"><div><small>OBRIGAÇÕES · MARÇO</small><h2>Guias e DCTFWeb</h2></div><span>2 vencem amanhã</span></div>
        <div class="demo-metric"><strong>21</strong><p>empresas acompanhadas no fechamento</p></div>
        <ul><li><i class="is-alert"></i><div><b>DCTFWeb · 03/2026</b><small>Alvorada Serviços · vence amanhã</small></div><em>Emitir</em></li><li><i class="is-ok"></i><div><b>Guia emitida</b><small>Nova Estrutura · comprovante registrado</small></div><em>Ver guia</em></li></ul>
      </section>
      <section id="demo-panel-integra" class="demo-panel" data-demo-panel="integra" role="tabpanel" aria-labelledby="demo-tab-integra" aria-hidden="true">
        <div class="demo-panel-head"><div><small>INTEGRA CONTADOR</small><h2>Caixa Postal DTE</h2></div><span>Consulta preparada</span></div>
        <div class="demo-metric"><strong>14</strong><p>empresas selecionadas para a consulta</p></div>
        <ul><li><i class="is-alert"></i><div><b>Aguardando autorização</b><small>O consumo ainda não foi enviado</small></div><em>Autorizar</em></li><li><i class="is-ok"></i><div><b>Mensagens recentes</b><small>Retornos organizados por empresa</small></div><em>Abrir caixa</em></li></ul>
      </section>
      <section id="demo-panel-reconciliation" class="demo-panel" data-demo-panel="reconciliation" role="tabpanel" aria-labelledby="demo-tab-reconciliation" aria-hidden="true">
        <div class="demo-panel-head"><div><small>FINANCEIRO · MARÇO</small><h2>Conciliação OFX</h2></div><span>38 de 41</span></div>
        <div class="demo-match"><div><small>EXTRATO OFX</small><strong>R$ 1.250,00</strong><span>Recebimento · 12/03</span></div><b>⇄</b><div><small>DOMÍNIO</small><strong>R$ 1.250,00</strong><span>Recebimento · 12/03</span></div></div>
        <div class="demo-success"><i class="is-ok"></i><span>Correspondência encontrada</span><em>Revisar</em></div>
      </section>
      <section id="demo-panel-reform" class="demo-panel" data-demo-panel="reform" role="tabpanel" aria-labelledby="demo-tab-reform" aria-hidden="true">
        <div class="demo-panel-head"><div><small>FONTES OFICIAIS</small><h2>Radar da Reforma</h2></div><span>Coleta diária</span></div>
        <div class="demo-metric"><strong>3</strong><p>fontes públicas acompanhadas</p></div>
        <ul><li><i class="is-alert"></i><div><b>Receita Federal</b><small>Atualizações fiscais e da reforma</small></div><em>Abrir fonte</em></li><li><i class="is-ok"></i><div><b>Fazenda e Planalto</b><small>Publicações reunidas por data</small></div><em>Ver radar</em></li></ul>
      </section>
      <section id="demo-panel-triage" class="demo-panel" data-demo-panel="triage" role="tabpanel" aria-labelledby="demo-tab-triage" aria-hidden="true">
        <div class="demo-panel-head"><div><small>DOCUMENTOS · TRIAGEM</small><h2>Caixa do escritório</h2></div><span>Fluxo ilustrativo</span></div>
        <div class="demo-metric"><strong>1</strong><p>anexo sem empresa definida para revisão antes do arquivo</p></div>
        <ul><li><i class="is-alert"></i><div><b>Documento sem empresa definida</b><small>Confira a origem e o código Domínio</small></div><em>Revisar</em></li><li><i class="is-ok"></i><div><b>Destino do escritório</b><small>Biblioteca interna ou pasta Windows</small></div><em>Escolher</em></li></ul>
      </section>
    </div>
  </div>
</figure>
