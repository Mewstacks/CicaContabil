{% extends "platform/emails/base.html" %}
{% block content %}
<p style="margin:0 0 16px;color:#627078;font-size:13px;font-weight:bold;letter-spacing:.08em;">SEGURANÇA DA CONTA</p>
<h1 style="margin:0 0 16px;font-size:26px;line-height:1.2;">Redefina sua senha</h1>
<p style="margin:0 0 24px;">Recebemos uma solicitação para redefinir a senha da sua conta CICA.</p>
<p style="margin:0 0 24px;"><a href="{{ protocol }}://{{ domain }}{% url 'hub:password-reset-confirm' uidb64=uid token=token %}" style="display:inline-block;padding:13px 18px;border-radius:8px;background:#16705f;color:#ffffff;font-weight:bold;text-decoration:none;">Criar nova senha</a></p>
<p style="margin:0;color:#627078;font-size:13px;">Se não foi você, ignore esta mensagem. Sua senha atual não será alterada.</p>
{% endblock %}
