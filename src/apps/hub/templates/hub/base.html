{% load static %}
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f4f1ea">
  <title>{% block title %}HubContador{% endblock %}</title>
  <link rel="icon" href="{% static 'hub/favicon.svg' %}" type="image/svg+xml">
  <link rel="stylesheet" href="{% static 'hub/hub.css' %}">
  <link rel="stylesheet" href="{% static 'hub/chrome.css' %}">
  <link rel="stylesheet" href="{% static 'hub/components.css' %}">
  <link rel="stylesheet" href="{% static 'hub/utility.css' %}">
  {% block extra_head %}{% endblock %}
</head>
<body>
  <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
  {% block body %}{% endblock %}
</body>
</html>
