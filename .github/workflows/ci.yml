name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # O agente Windows não era construído por nenhum fluxo, e por isso um erro de
  # compilação em `AgentClient` sobreviveu no ramo principal sem ninguém notar.
  # A construção roda em Linux: o serviço tem alvo `net8.0-windows` e só compila,
  # não executa, aqui — o que já basta para o erro aparecer. Os testes ficam na
  # biblioteca de contratos, que não depende do Windows.
  agent:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: "8.0.x"
      - run: dotnet build agent-windows/src/Cica.Agent.Service/Cica.Agent.Service.csproj -c Release
      - run: dotnet build agent-windows/src/Cica.Agent.Configurator/Cica.Agent.Configurator.csproj -c Release
      - run: dotnet build agent-windows/src/Cica.Agent.OdbcBridge/Cica.Agent.OdbcBridge.csproj -c Release
      - run: dotnet test agent-windows/tests/Cica.Agent.Tests/Cica.Agent.Tests.csproj -c Release

  agent-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: "8.0.x"
      - name: Build unified Windows package
        shell: pwsh
        run: ./agent-windows/build.ps1 -Version 1.0.0
      - name: Verify package manifest
        shell: pwsh
        run: |
          $release = Get-Content ./agent-windows/artifacts/release.json -Raw | ConvertFrom-Json
          $msi = Resolve-Path ./agent-windows/artifacts/CicaAgent.msi
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $msi).Hash.ToLowerInvariant()
          if ($release.version -ne '1.0.0') { throw 'Unexpected package version.' }
          if ($release.sha256 -ne $actual) { throw 'Package checksum differs from release.json.' }

  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        # Same PostgreSQL 17 image validated locally; no production database access.
        image: postgres:17-bookworm@sha256:051f7b7b3abdd564d5d1bd1e8c4b9c1b6e77087d1dd22020ede611c096a272e0
        env:
          POSTGRES_USER: cica_test
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: cica_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U cica_test -d cica_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.12.0
      - run: uv sync --locked --all-extras
      - run: uv run ruff check .
      - run: uv run python manage.py check
      - run: uv run python manage.py makemigrations --check --dry-run
      - run: uv run pytest -q
      - name: PostgreSQL regression, migrations and concurrency
        env:
          CICA_TEST_POSTGRES_PORT: "55432"
          TEST_USE_EXTERNAL_SERVICES: "false"
        run: uv run pytest --ds=config.settings.test_postgresql --tb=short -q
      - run: docker build --tag saas-backend:test .
      - run: docker build --file runtime/multimodal/Dockerfile --tag hubcontador-multimodal:test .
      - run: >-
          docker build --file runtime/trainer/Dockerfile
          --build-arg LLAMAFACTORY_IMAGE=hiyouga/llamafactory@sha256:46b6969e444681829294ed1fce2c4e8848613e654b682dc0359ba94357a0267b
          --tag cica-trainer:test .
