name: Deploy Cobalchini

on:
  repository_dispatch:
    types: [crmew-release-approved]
  workflow_dispatch:
    inputs:
      image_digest:
        description: Imagem imutável aprovada (ghcr.io/...@sha256:...)
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: cobalchini-production
  cancel-in-progress: false

jobs:
  deploy:
    # Runner exclusivo, vinculado somente a este repositório privado e ambiente protegido.
    runs-on: [self-hosted, windows, hub-cobalchini-production]
    environment: cobalchini-production
    timeout-minutes: 20
    env:
      EXPECTED_IMAGE_REPOSITORY: ${{ vars.HUB_IMAGE_REPOSITORY }}
      COBALCHINI_ENV_FILE: ${{ vars.COBALCHINI_ENV_FILE }}
      COSIGN_PUBLIC_KEY_B64: ${{ secrets.COSIGN_PUBLIC_KEY_B64 }}
      GHCR_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout trusted deployment definition
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate immutable approved image
        shell: pwsh
        env:
          REQUESTED_IMAGE: ${{ inputs.image_digest || github.event.client_payload.image_digest }}
        run: |
          $expected = $env:EXPECTED_IMAGE_REPOSITORY.Trim().ToLowerInvariant()
          $requested = $env:REQUESTED_IMAGE.Trim().ToLowerInvariant()
          if ($expected -notmatch '^ghcr\.io/[a-z0-9._/-]+$') { throw 'HUB_IMAGE_REPOSITORY do ambiente precisa ser um repositório GHCR válido.' }
          if ($requested -notmatch "^$([regex]::Escape($expected))@sha256:[a-f0-9]{64}$") { throw 'A release precisa usar o digest imutável do repositório GHCR autorizado.' }
          if ([string]::IsNullOrWhiteSpace($env:COBALCHINI_ENV_FILE)) { throw 'COBALCHINI_ENV_FILE não está configurado no ambiente protegido.' }
          if (-not (Test-Path -LiteralPath $env:COBALCHINI_ENV_FILE -PathType Leaf)) { throw 'O arquivo de ambiente Cobalchini não existe fora do workspace.' }
          $previous = (Select-String -LiteralPath $env:COBALCHINI_ENV_FILE -Pattern '^HUB_IMAGE=' | Select-Object -First 1).Line -replace '^HUB_IMAGE=', ''
          if ($previous -notmatch "^$([regex]::Escape($expected))@sha256:[a-f0-9]{64}$") { throw 'A imagem atual precisa ser um digest imutável do repositório autorizado.' }
          "HUB_IMAGE=$requested" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PREVIOUS_HUB_IMAGE=$previous" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Authenticate registry with ephemeral job token
        shell: pwsh
        run: |
          $env:GHCR_TOKEN | docker login ghcr.io --username $env:GITHUB_ACTOR --password-stdin
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao autenticar no GHCR.' }

      - name: Verify image signature
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:COSIGN_PUBLIC_KEY_B64)) { throw 'Chave pública Cosign não configurada no ambiente protegido.' }
          if (-not (Get-Command cosign -ErrorAction SilentlyContinue)) { throw 'Cosign não está instalado no runner de produção.' }
          $keyPath = Join-Path $env:RUNNER_TEMP 'hubcontador-cosign.pub'
          try {
            [System.IO.File]::WriteAllBytes($keyPath, [Convert]::FromBase64String($env:COSIGN_PUBLIC_KEY_B64))
            cosign verify --key $keyPath $env:HUB_IMAGE
            if ($LASTEXITCODE -ne 0) { throw 'A assinatura da imagem não foi validada.' }
          } finally {
            Remove-Item -LiteralPath $keyPath -Force -ErrorAction SilentlyContinue
          }

      - name: Validate configuration, pull and migrate
        shell: pwsh
        run: |
          docker compose --env-file $env:COBALCHINI_ENV_FILE -f compose.cobalchini.yml config --quiet
          if ($LASTEXITCODE -ne 0) { throw 'Configuração Docker Compose inválida.' }
          docker compose --env-file $env:COBALCHINI_ENV_FILE -f compose.cobalchini.yml pull web worker beat migrate
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao baixar a imagem aprovada.' }
          docker compose --env-file $env:COBALCHINI_ENV_FILE -f compose.cobalchini.yml --profile deploy run --rm migrate
          if ($LASTEXITCODE -ne 0) { throw 'Migration incompatível; deploy abortado.' }

      - name: Start and smoke test
        shell: pwsh
        run: |
          docker compose --env-file $env:COBALCHINI_ENV_FILE -f compose.cobalchini.yml up -d web worker beat
          if ($LASTEXITCODE -ne 0) { throw 'Serviços não iniciaram.' }
          $deadline = (Get-Date).AddMinutes(3)
          do {
            try {
              $response = Invoke-WebRequest -UseBasicParsing -TimeoutSec 5 http://127.0.0.1:8000/api/v1/health/ready/
              if ($response.StatusCode -eq 200) { exit 0 }
            } catch {}
            Start-Sleep -Seconds 5
          } while ((Get-Date) -lt $deadline)
          throw 'Smoke test não ficou saudável.'

      - name: Persist approved running image
        shell: pwsh
        run: |
          (Get-Content -LiteralPath $env:COBALCHINI_ENV_FILE) -replace '^HUB_IMAGE=.*$', "HUB_IMAGE=$env:HUB_IMAGE" | Set-Content -LiteralPath $env:COBALCHINI_ENV_FILE -Encoding utf8

      - name: Confirm release to CRMew
        shell: pwsh
        run: |
          try {
            docker compose --env-file $env:COBALCHINI_ENV_FILE -f compose.cobalchini.yml exec -T web python manage.py acknowledge_control_release --release $env:HUB_IMAGE --outcome released
            if ($LASTEXITCODE -ne 0) { Write-Warning 'Release aplicada, mas CRMew não confirmou o status.' }
          } catch { Write-Warning 'Release aplicada, mas o acknowledgement CRMew falhou.' }

      - name: Roll back running services on failure
        if: failure()
        shell: pwsh
        run: |
          $failedImage = $env:HUB_IMAGE
          if ($env:PREVIOUS_HUB_IMAGE -match '^ghcr\.io/[a-z0-9._/-]+@sha256:[a-f0-9]{64}$') {
            $env:HUB_IMAGE = $env:PREVIOUS_HUB_IMAGE
            docker compose --env-file $env:COBALCHINI_ENV_FILE -f compose.cobalchini.yml up -d web worker beat
            try {
              docker compose --env-file $env:COBALCHINI_ENV_FILE -f compose.cobalchini.yml exec -T web python manage.py acknowledge_control_release --release $failedImage --outcome rolled_back
              if ($LASTEXITCODE -ne 0) { Write-Warning 'Rollback aplicado, mas CRMew nÃ£o confirmou o status.' }
            } catch { Write-Warning 'Rollback aplicado, mas o acknowledgement CRMew falhou.' }
          }
          Write-Error 'Release falhou. A imagem anterior foi restaurada quando disponível; migrations nunca sofrem downgrade automático.'

      - name: End registry session
        if: always()
        shell: pwsh
        run: docker logout ghcr.io
