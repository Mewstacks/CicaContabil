name: Deploy Cobalchini

on:
  repository_dispatch:
    types: [approved-cobalchini-release]
  workflow_dispatch:
    inputs:
      image:
        description: Immutable GHCR image reference (repository@sha256:digest)
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: cobalchini-production
  cancel-in-progress: false

jobs:
  deploy:
    # This self-hosted runner is the Cobalchini host. The protected environment
    # supplies the repository, local env-file path and Cosign public key.
    runs-on: [self-hosted, windows, hub-cobalchini-production]
    environment: cobalchini-production
    env:
      EXPECTED_IMAGE_REPOSITORY: ${{ vars.HUB_IMAGE_REPOSITORY }}
      COBALCHINI_ENV_FILE: ${{ vars.COBALCHINI_ENV_FILE }}
      COSIGN_PUBLIC_KEY_B64: ${{ secrets.COSIGN_PUBLIC_KEY_B64 }}
      RELEASE_IMAGE: ${{ github.event.client_payload.image || inputs.image }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Validate release and signature
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:EXPECTED_IMAGE_REPOSITORY) -or [string]::IsNullOrWhiteSpace($env:COBALCHINI_ENV_FILE)) { throw 'Ambiente Cobalchini incompleto.' }
          if (-not (Test-Path -LiteralPath $env:COBALCHINI_ENV_FILE)) { throw 'Arquivo de ambiente Cobalchini não encontrado.' }
          $expected = [regex]::Escape($env:EXPECTED_IMAGE_REPOSITORY.TrimEnd('/'))
          if ($env:RELEASE_IMAGE -notmatch "^$expected@sha256:[a-f0-9]{64}$") { throw 'A release precisa ser um digest SHA-256 do repositório GHCR aprovado.' }
          if ([string]::IsNullOrWhiteSpace($env:COSIGN_PUBLIC_KEY_B64)) { throw 'Chave pública Cosign ausente.' }
          $keyPath = Join-Path $env:RUNNER_TEMP 'hubcontador-cosign.pub'
          [IO.File]::WriteAllBytes($keyPath, [Convert]::FromBase64String($env:COSIGN_PUBLIC_KEY_B64))
          cosign verify --key $keyPath $env:RELEASE_IMAGE
          Remove-Item -LiteralPath $keyPath -Force

      - name: Deploy immutable image with rollback
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $registry = 'ghcr.io'
          $env:HUB_IMAGE = $env:RELEASE_IMAGE
          $previousLine = Select-String -LiteralPath $env:COBALCHINI_ENV_FILE -Pattern '^HUB_IMAGE=' | Select-Object -First 1
          if ($null -eq $previousLine) { throw 'HUB_IMAGE ausente no arquivo de ambiente.' }
          $env:PREVIOUS_HUB_IMAGE = $previousLine.Line.Substring('HUB_IMAGE='.Length)
          if ($env:PREVIOUS_HUB_IMAGE -notmatch '^.+@sha256:[a-f0-9]{64}$') { throw 'Imagem anterior não usa digest imutável.' }
          try {
            $env:GITHUB_TOKEN | docker login $registry --username $env:GITHUB_ACTOR --password-stdin
            docker compose --env-file $env:COBALCHINI_ENV_FILE -f compose.cobalchini.yml config --quiet
            docker compose --env-file $env:COBALCHINI_ENV_FILE -f compose.cobalchini.yml pull
            docker compose --env-file $env:COBALCHINI_ENV_FILE -f compose.cobalchini.yml --profile deploy run --rm migrate
            docker compose --env-file $env:COBALCHINI_ENV_FILE -f compose.cobalchini.yml up -d --remove-orphans
            $ready = $false
            foreach ($attempt in 1..24) {
              try {
                $response = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:8000/api/v1/health/ready/' -TimeoutSec 5
                if ($response.StatusCode -eq 200) { $ready = $true; break }
              } catch { Start-Sleep -Seconds 5 }
            }
            if (-not $ready) { throw 'Readiness /api/v1/health/ready/ não confirmou HTTP 200.' }
            $temporary = "$env:COBALCHINI_ENV_FILE.new"
            (Get-Content -LiteralPath $env:COBALCHINI_ENV_FILE) -replace '^HUB_IMAGE=.*$', "HUB_IMAGE=$env:HUB_IMAGE" | Set-Content -LiteralPath $temporary -Encoding utf8
            Move-Item -LiteralPath $temporary -Destination $env:COBALCHINI_ENV_FILE -Force
            docker compose --env-file $env:COBALCHINI_ENV_FILE -f compose.cobalchini.yml run --rm web python manage.py acknowledge_control_release --release $env:HUB_IMAGE --outcome released
          } catch {
            $failedImage = $env:HUB_IMAGE
            $env:HUB_IMAGE = $env:PREVIOUS_HUB_IMAGE
            docker compose --env-file $env:COBALCHINI_ENV_FILE -f compose.cobalchini.yml up -d --remove-orphans
            docker compose --env-file $env:COBALCHINI_ENV_FILE -f compose.cobalchini.yml run --rm web python manage.py acknowledge_control_release --release $failedImage --outcome rolled_back
            throw
          } finally {
            docker logout ghcr.io
          }
