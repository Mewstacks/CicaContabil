name: Validate Windows agent installer

on:
  push:
    branches: [codex/agent-windows-validation]
    paths:
      - agent-windows/**
      - contracts/datasets/**
      - .github/workflows/agent-windows-validation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-test:
    # Standard public runner only; never install on a customer's/self-hosted machine.
    if: github.event.repository.private == false
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 8.0.x
      - name: Test contracts
        shell: pwsh
        run: >-
          dotnet test agent-windows/tests/Cica.Agent.Tests/Cica.Agent.Tests.csproj
          -c Release --logger 'trx;LogFileName=contracts.trx'
          --results-directory agent-windows/artifacts/validation
      - name: Build MSI
        shell: pwsh
        run: ./agent-windows/build.ps1 -Version 1.0.0
      - name: Install, repair, restart, diagnose and uninstall
        shell: pwsh
        run: ./agent-windows/test-installer.ps1
      - name: Preserve tested installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: CicaAgent-tested-windows-x64
          path: |
            agent-windows/artifacts/CicaAgent.msi
            agent-windows/artifacts/CicaAgent.msi.sha256
            agent-windows/artifacts/release.json
            agent-windows/artifacts/dependency-inventory.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: CicaAgent-windows-validation
          path: agent-windows/artifacts/validation/
          if-no-files-found: warn
          retention-days: 1
