name: Validate Windows agent installer

on:
  push:
    branches: [codex/agent-windows-validation]
    paths:
      - agent-windows/**
      - contracts/datasets/**
      - .github/workflows/agent-windows-validation.yml
  workflow_dispatch:
    inputs:
      inventory_only:
        description: Validate only the bounded CONTAD metadata inventory
        type: boolean
        default: false
      probe_only:
        description: Validate only the temporary SYSTEM ODBC diagnostic
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  install-test:
    # Standard public runner only; never install on a customer's/self-hosted machine.
    if: github.event.repository.private == false && inputs.probe_only != true && inputs.inventory_only != true
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.x
      - name: Test contracts
        shell: pwsh
        run: >-
          dotnet test agent-windows/tests/Cica.Agent.Tests/Cica.Agent.Tests.csproj
          -c Release --logger 'trx;LogFileName=contracts.trx'
          --results-directory agent-windows/artifacts/validation
      - name: Build MSI
        shell: pwsh
        run: ./agent-windows/build.ps1 -Version 1.0.7
      - name: Install, repair, restart, diagnose and uninstall
        shell: pwsh
        run: ./agent-windows/test-installer.ps1
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 11147d4bdc040e2ed2d4b80ee2942f2516f758aa
          path: baseline-agent
          persist-credentials: false
      - name: Build baseline and verify configured upgrade
        shell: pwsh
        run: |
          ./baseline-agent/agent-windows/build.ps1 -Version 1.0.6
          ./agent-windows/test-registration-upgrade.ps1 -BaselineMsi ./baseline-agent/agent-windows/artifacts/CicaAgent.msi
      - name: Preserve tested installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: CicaAgent-tested-windows-x64
          path: |
            agent-windows/artifacts/CicaAgent.msi
            agent-windows/artifacts/CicaAgent.msi.sha256
            agent-windows/artifacts/release.json
            agent-windows/artifacts/dependency-inventory.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: CicaAgent-windows-validation
          path: agent-windows/artifacts/validation/
          if-no-files-found: warn
          retention-days: 1

  system-odbc-probe:
    if: github.event.repository.private == false && inputs.inventory_only != true
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate SYSTEM task, credential isolation, failure and cleanup
        shell: powershell
        run: ./agent-windows/test-system-odbc-probe.ps1
      - name: Preserve diagnostic test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: system-odbc-probe-validation
          path: agent-windows/artifacts/validation/system-odbc-probe.json
          if-no-files-found: warn
          retention-days: 1

  contad-inventory:
    if: github.event.repository.private == false
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate bounded metadata inventory, errors and private report
        shell: powershell
        run: ./agent-windows/test-contad-inventory.ps1
      - name: Validate document shape aggregates and safe failures
        shell: powershell
        run: ./agent-windows/test-contad-document-profile.ps1
      - name: Validate bounded relation metadata and credential isolation
        shell: powershell
        run: ./agent-windows/test-contad-relations.ps1
      - name: Preserve inventory validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: contad-inventory-validation
          path: |
            agent-windows/artifacts/validation/contad-inventory.json
            agent-windows/artifacts/validation/contad-document-profile.json
            agent-windows/artifacts/validation/contad-relations.json
          if-no-files-found: warn
          retention-days: 1
